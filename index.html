<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Somnenie — нутрициология без мифов</title>
  <meta name="theme-color" content="#070707">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Somnenie">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-pool" aria-hidden="true"></div>
  <div class="lamp lamp-warm" aria-hidden="true"></div>
  <div class="lamp lamp-green" aria-hidden="true"></div>
  <div class="sweep" aria-hidden="true"></div>
  <header id="topbar">
    <button id="back-btn" class="hidden" title="Назад" aria-label="Назад">←</button>
    <div class="topbar-brand">
      <span class="brand-mark" aria-hidden="true">
        <img class="brand-mark-img" src="assets/generated/icon-today.png" alt="" loading="eager" decoding="async">
        <svg class="brand-mark-svg" viewBox="0 0 72 72" fill="none">
          <rect x="4" y="4" width="64" height="64" rx="18" fill="currentColor" opacity=".12"/>
          <path d="M19 45c13 2 27-5 33-23-17-1-31 6-33 23Z" fill="currentColor" opacity=".18"/>
          <path d="M20 45c13 2 26-5 32-22-17-1-30 6-32 22Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25 42c7-5 14-10 22-14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="22" cy="24" r="4" fill="currentColor"/>
          <circle cx="50" cy="49" r="4" fill="currentColor"/>
          <path d="M23 24c8 5 17 13 27 25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
        </svg>
      </span>
      <h1 id="title">Нутрициология</h1>
    </div>
    <button id="profile-btn" title="Прогресс, память и журнал" aria-label="Открыть прогресс, память и журнал">
      <span class="profile-meter" aria-hidden="true"></span>
      <img class="btn-icon generated-icon profile-button-icon" src="assets/generated/icon-progress.png" alt="" aria-hidden="true" loading="eager" decoding="async">
      <span>Прогресс</span>
    </button>
  </header>
  <nav id="tabs" class="hidden"></nav>
  <main id="screen"></main>
  <script src="lib/marked.min.js"></script>
  <script src="core/constants.js"></script>
  <script src="core/storage.js"></script>
  <script src="core/review.js"></script>
  <script src="core/quiz.js"></script>
  <script src="app.js"></script>
</body>
</html>
